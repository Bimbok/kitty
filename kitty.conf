# ==============================================================================
#  THEME
# ==============================================================================
include colors.conf

# ==============================================================================
#  FONTS
# ==============================================================================
font_family      family="FiraCode Nerd Font" style="SemiBold"
bold_font        family="FiraCode Nerd Font" style="Bold"
italic_font      family="FiraCode Nerd Font" style="Retina"
bold_italic_font auto

font_size 14.0
disable_ligatures cursor
box_drawing_scale 0.001, 1, 1.5, 2

# ==============================================================================
#  CURSOR & MOUSE (ELEGANT GLIDE)
# ==============================================================================
cursor_shape block
cursor_blink_interval 0

# Smooth, subtle trailing that triggers only on real cursor leaps
cursor_trail 3
cursor_trail_decay 0.1 0.7
cursor_trail_start_threshold 0

mouse_hide_wait 2.0
url_style curly
open_url_with default
detect_urls yes
underline_hyperlinks hover

# ==============================================================================
#  SCROLLBACK & BEHAVIOR
# ==============================================================================
scrollback_lines 10000
scrollback_pager_history_size 16
scrollbar_width 0
momentum_scroll 0.96
pixel_scroll yes

enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no

# ==============================================================================
#  WINDOW LAYOUT & BLUR
# ==============================================================================
remember_window_size  no
initial_window_width  1400
initial_window_height 800

draw_minimal_borders yes
window_border_width  1.5
window_margin_width  8
single_window_margin_width 0
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

background_opacity 0.6
background_blur 32

# ==============================================================================
#  TAB BAR
# ==============================================================================
tab_bar_edge buttom
tab_bar_style powerline
tab_powerline_style round
tab_bar_align left
tab_bar_min_tabs 2

tab_activity_symbol "󰚢 "
tab_title_template        " {fmt.fg.tab}{index} {title} "
active_tab_title_template " {fmt.fg.tab}{index} {title}{' [󰄯]' if layout_name == 'stack' else ''} "

active_tab_font_style   bold
inactive_tab_font_style normal

# ==============================================================================
#  SYSTEM & RENDERING (WAYLAND TUNED)
# ==============================================================================
shell /usr/bin/fish
editor nvim

clipboard_control write-clipboard write-primary read-clipboard read-primary

sync_to_monitor yes
linux_display_server wayland
repaint_delay 6
input_delay 1

# ==============================================================================
#  KEYBINDINGS
# ==============================================================================
# Configuration Reload
map ctrl+shift+f5 load_config_file

# Font Scaling
map ctrl+shift+equal     change_font_size all +1.5
map ctrl+shift+minus     change_font_size all -1.5
map ctrl+shift+backspace change_font_size all 0

# Pane Navigation (Vim-style)
map alt+h neighboring_window left
map alt+j neighboring_window bottom
map alt+k neighboring_window top
map alt+l neighboring_window right

# Pane Resizing
map ctrl+left  resize_window narrower 3
map ctrl+right resize_window wider 3
map ctrl+up    resize_window taller 2
map ctrl+down  resize_window shorter 2

# Tab Navigation
map alt+t new_tab
map alt+w close_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
