# ==============================================================================
#  THEME
# ==============================================================================
include colors.conf

# ==============================================================================
#  FONTS
# ==============================================================================
font_family      FiraCode Nerd Font SemBd
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 14.0
disable_ligatures never

# ==============================================================================
#  CURSOR & MOUSE
# ==============================================================================
cursor_shape block
cursor_trail 100
cursor_trail_decay 0.01 0.5
cursor_trail_start_threshold 0

mouse_hide_wait 3.0

# Make links clickable and styled
url_style curly
open_url_with default
detect_urls yes

# ==============================================================================
#  SCROLLBACK
# ==============================================================================
scrollback_lines 10000
scrollback_pager_history_size 10
scrollbar_width 0
momentum_scroll 0.96
pixel_scroll yes

# ==============================================================================
#  WINDOW LAYOUT
# ==============================================================================
remember_window_size  no
initial_window_width  1400
initial_window_height 800

# Margins and Padding
draw_minimal_borders yes
window_border_width  2
window_margin_width  10
single_window_margin_width 0
window_padding_width 15
hide_window_decorations yes

# Opacity & Blur
background_opacity 0.7
background_blur 32

# ==============================================================================
#  TAB BAR
# ==============================================================================
tab_bar_style powerline
tab_bar_align left
tab_bar_min_tabs 2
tab_powerline_style round

tab_activity_symbol "󰚢"
tab_title_template          " {index} {title} "
active_tab_title_template   " {index} {title} "

active_tab_font_style   bold
inactive_tab_font_style normal

# ==============================================================================
#  SHELL & SYSTEM
# ==============================================================================
shell /usr/bin/fish
editor nvim

# Performance tweak
sync_to_monitor yes
linux_display_server wayland
repaint_delay 8
input_delay 1

# ==============================================================================
#  KEYBINDINGS
# ==============================================================================
# Reload config without restarting kitty
map ctrl+shift+f5 load_config_file

# Zoom fonts easily
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0

map alt+h neighboring_window left
map alt+j neighboring_window bottom
map alt+k neighboring_window top
map alt+l neighboring_window right

map ctrl+left resize_window narrower
map ctrl+right resize_window wider
map ctrl+up resize_window taller
map ctrl+down resize_window shorter
